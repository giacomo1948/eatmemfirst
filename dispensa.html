<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Dispensa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.page-dispensa-body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-image: url('ripostiglio.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-logo-container h1 {
            color: #ffffff;
            font-size: 2.6rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.85);
            letter-spacing: 1.5px;
        }

        /* Sezione centrale fluttuante senza tabellone pesante */
        .dispensa-center-area {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Barra di ricerca color panna in stile fluttuante */
        .search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            background: rgba(255, 253, 245, 0.9);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: #ffffff;
            color: #333;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #2b7a78;
        }

        /* Pulsante Cerca in stile 3D coordinato */
        .search-btn {
            background: linear-gradient(to bottom, #3a9b98, #2b7a78);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.1s ease;
        }

        .search-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Box dei risultati di ricerca fluttuante */
        .search-results-box {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .product-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 6px;
        }

        .product-result-item:last-child {
            border-bottom: none;
        }

        .product-result-item:hover {
            background: #f1f5f9;
        }

        .product-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background-color: #22c55e; }
        .dot-yellow { background-color: #eab308; }
        .dot-red { background-color: #ef4444; }

        .product-name-text {
            font-weight: bold;
            color: #1e293b;
            font-size: 0.95rem;
        }

        .product-qty-badge {
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: bold;
        }

        /* I 3 pulsanti in basso separati con effetto 3D */
        .nav-buttons-container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .nav-btn-3d {
            background: linear-gradient(to bottom, #ffffff, #f1f5f9);
            border: 2px solid #cbd5e1;
            border-bottom-width: 4px;
            border-radius: 12px;
            padding: 18px 10px;
            text-decoration: none;
            color: #1e293b;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            transition: all 0.15s ease;
        }

        .nav-btn-3d:hover {
            background: linear-gradient(to bottom, #ffffff, #e2e8f0);
            border-color: #2b7a78;
            color: #2b7a78;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .nav-btn-3d:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        /* Finestra Modale Dettaglio Prodotto */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .top-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .nav-buttons-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .search-container {
                flex-direction: column;
            }
            .search-btn {
                padding: 12px;
            }
        }
    </style>
</head>
<body class="page-dispensa-body">

    <div class="top-header">
        <div class="top-logo-container">
            <h1>EatMeFirst - Dispensa</h1>
        </div>
    </div>

    <!-- Area di ricerca centrale trasparente/panna -->
    <div class="dispensa-center-area">
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Descrizione prodotto o scrivi numero codice a barra..." onkeyup="handleSearch(event)">
            <button class="search-btn" onclick="executeSearch()">Cerca</button>
        </div>

        <!-- Box dei risultati di ricerca a comparsa -->
        <div class="search-results-box" id="searchResultsBox">
            <div class="product-result-item" onclick="openProductDetail('Latte Intero', '1 Litro', 'Scadenza regolare', 'Note: Preso per compleanno di Marco', 'dot-green')">
                <div class="product-info-left">
                    <span class="status-dot dot-green" title="Scadenza OK"></span>
                    <span class="product-name-text">Latte Intero (Cod: 800123456789)</span>
                </div>
                <div class="product-qty-badge">Disp: 2 pz</div>
            </div>
            <div class="product-result-item" onclick="openProductDetail('Pasta Integrale', '500g', 'In scadenza', 'Note: Nessuna annotazione', 'dot-yellow')">
                <div class="product-info-left">
                    <span class="status-dot dot-yellow" title="In scadenza"></span>
                    <span class="product-name-text">Pasta Integrale</span>
                </div>
                <div class="product-qty-badge">Disp: 1 pz</div>
            </div>
        </div>
    </div>

    <!-- I 3 pulsanti in basso tridimensionali e separati -->
    <div class="nav-buttons-container">
        <a href="categoria.html" class="nav-btn-3d">🏷️ Categorie</a>
        <a href="ubicazione.html" class="nav-btn-3d">📍 Ubicazioni</a>
        <a href="spesa.html" class="nav-btn-3d">🛒 Lista Spesa</a>
    </div>

    <!-- Modale Dettaglio Prodotto al Click -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✖</button>
            <h2 id="modalTitle" style="color: #2b7a78; margin-bottom: 15px; font-size: 1.3rem;">Dettaglio Prodotto</h2>
            <div id="modalBody" style="font-size: 0.95rem; color: #333; line-height: 1.6;">
                <!-- Dati dinamici del prodotto -->
            </div>
        </div>
    </div>

    <script>
        function executeSearch() {
            let query = document.getElementById('searchInput').value.trim();
            let resultsBox = document.getElementById('searchResultsBox');
            if (query.length > 0) {
                resultsBox.style.display = 'block';
            } else {
                resultsBox.style.display = 'none';
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                executeSearch();
            } else {
                let query = document.getElementById('searchInput').value.trim();
                document.getElementById('searchResultsBox').style.display = query.length > 0 ? 'block' : 'none';
            }
        }

        function openProductDetail(name, qty, status, notes, dotClass) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalBody').innerHTML = `
                <div style="background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center;">
                    <div style="font-size: 3rem; margin-bottom: 5px;">📦</div>
                    <div style="font-size: 0.85rem; color: #64748b;">Nessuna immagine caricata</div>
                </div>
                <p><strong>Quantità disponibile:</strong> ${qty}</p>
                <p><strong>Stato Scadenza:</strong> <span class="status-dot ${dotClass}" style="vertical-align: middle; margin-right: 5px;"></span> ${status}</p>
                <p style="margin-top: 10px; background: #fffbeb; padding: 8px; border-radius: 6px; border-left: 3px solid #eab308;"><strong>Note:</strong> ${notes}</p>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }
    </script>
</body>
</html>
