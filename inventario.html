<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Dispensa e Carico</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-dashboard-body">

    <div class="dash-header-top">
        <div class="dash-app-title">EatMeFirst</div>
        <button class="dash-menu-icon" onclick="toggleMenu()">☰ Menu</button>
    </div>

    <div id="dashboard-main-view" class="dash-main-layout">
        <div class="master-traffic-light">
            <div class="master-bulb" id="bulb-red"></div>
            <div class="master-bulb" id="bulb-yellow"></div>
            <div class="master-bulb" id="bulb-green"></div>
        </div>

        <div class="dash-buttons-column">
            <button class="dash-soft-btn" onclick="alert('Sezione merci in dispensa')">Merci in dispensa</button>
            <button class="dash-soft-btn" onclick="alert('Scadenza consigliata')">Scadenza consigliata</button>
            <button class="dash-soft-btn" onclick="alert('Scadenza tassativa')">Scadenza tassativa</button>
            <button class="dash-soft-btn action-load" onclick="openLoadGoods()">➕ Carico merci</button>
            <button class="dash-soft-btn" onclick="alert('Scarico merci')">➖ Scarico merci</button>
        </div>
    </div>

    <div id="load-goods-view" style="display: none; width: 100%;">
        <div class="load-container">
            <button class="scan-action-btn" id="btn-start-scan" onclick="startScanner()">
                📷 Scansiona codice a barre / QR
            </button>

            <div id="scanner-section">
                <div id="reader"></div>

                <div class="product-result-grid">
                    <div class="product-form-fields">
                        <div class="form-row">
                            <label>Codice Rilevato:</label>
                            <input type="text" id="detected-code" readonly style="background: #e9ecef; font-weight: bold;">
                        </div>

                        <div class="form-row" id="desc-container"></div>

                        <div class="form-row">
                            <label>Quantità:</label>
                            <input type="number" id="prod-qty" value="1" min="1">
                        </div>
                    </div>

                    <div>
                        <label style="font-size: 0.78rem; font-weight: bold; margin-bottom: 3px; display: block;">Immagine:</label>
                        <img id="product-img-preview" class="product-image-preview" src="" alt="Foto" style="display:none;">
                        <div id="no-image-placeholder" class="product-image-preview">Nessuna immagine</div>
                    </div>
                </div>

                <div class="form-row">
                    <label>Registra Scadenza:</label>
                    <div class="expiry-buttons">
                        <button class="expiry-btn btn-tassativa" onclick="saveProduct('tassativa')">Tassativa</button>
                        <button class="expiry-btn btn-consigliata" onclick="saveProduct('consigliata')">Consigliata</button>
                    </div>
                    <div class="notice-text">Nota: Se hai prodotti identici ma con scadenze diverse, fai inserimenti separati.</div>
                </div>

                <div class="form-row" style="margin-top: 8px; border-top: 1px solid #eee; padding-top: 6px;">
                    <label>Nota Evento Speciale:</label>
                    <textarea rows="2" placeholder="Acquisto per evento... data... avvisare... giorni prima"></textarea>
                </div>
                
                <button class="btn btn-secondary" style="margin-top: 10px; width: 100%;" onclick="closeLoadGoods()">Torna alla Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;

        function openLoadGoods() {
            document.getElementById('dashboard-main-view').style.display = 'none';
            document.getElementById('load-goods-view').style.display = 'block';
        }

        function closeLoadGoods() {
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
            document.getElementById('scanner-section').classList.remove('active');
            document.getElementById('btn-start-scan').style.display = 'block';
            document.getElementById('load-goods-view').style.display = 'none';
            document.getElementById('dashboard-main-view').style.display = 'flex';
        }

        function startScanner() {
            const section = document.getElementById('scanner-section');
            section.classList.add('active');
            document.getElementById('btn-start-scan').style.display = 'none';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 10, qrbox: { width: 220, height: 100 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Fotocamera non disponibile:", err);
                document.getElementById('reader').innerHTML = "<div style='padding:15px; color:#fff; text-align:center; font-size:0.85rem;'>Fotocamera non disponibile. Simulazione codice attivo.</div>";
                onScanSuccess("8001505001110 (Test Barcode)");
            });
        }

        function onScanSuccess(decodedText) {
            document.getElementById('detected-code').value = decodedText;

            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }

            processProductLookup(decodedText);
        }

        function onScanFailure(error) {}

        function processProductLookup(code) {
            const descContainer = document.getElementById('desc-container');
            const imgPreview = document.getElementById('product-img-preview');
            const noImgPlaceholder = document.getElementById('no-image-placeholder');

            let productFound = false; // Metti true per simulare un prodotto trovato con immagine

            if (productFound) {
                descContainer.innerHTML = `
                    <label>Descrizione Prodotto:</label>
                    <input type="text" value="Latte Intero Fresco 1L" readonly style="background: #e9ecef;">
                `;
                imgPreview.src = "https://via.placeholder.com/100?text=Prodotto";
                imgPreview.style.display = "block";
                noImgPlaceholder.style.display = "none";
            } else {
                // Prodotto non trovato: compare la casella "fai tu"
                descContainer.innerHTML = `
                    <label style="color: #d32f2f;">Descrizione non disponibile (fai tu):</label>
                    <input type="text" id="manual-desc" placeholder="Inserisci nome prodotto...">
                `;
                imgPreview.style.display = "none";
                noImgPlaceholder.style.display = "flex";
                noImgPlaceholder.innerText = "Nessuna immagine";
            }
        }

        function saveProduct(type) {
            // Esempio di accensione dinamica del semaforo in base alla scadenza salvata
            if (type === 'tassativa') {
                document.getElementById('bulb-red').style.backgroundColor = '#d32f2f';
                document.getElementById('bulb-red').style.boxShadow = '0 0 12px #d32f2f';
                alert('Prodotto salvato con scadenza Tassativa (Semaforo Rosso attivato)');
            } else {
                document.getElementById('bulb-yellow').style.backgroundColor = '#fbc02d';
                document.getElementById('bulb-yellow').style.boxShadow = '0 0 12px #fbc02d';
                alert('Prodotto salvato con scadenza Consigliata (Semaforo Giallo attivato)');
            }
            closeLoadGoods();
        }

        function toggleMenu() {
            alert('Menu principale');
        }
    </script>
</body>
</html>
