<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Copertina</title>
    <style>
        body.page-cover-body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .cover-text {
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .cover-text .line1 {
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .cover-text .line2 {
            font-weight: bold;
        }

        .cover-btn {
            padding: 12px 30px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .cover-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body class="page-cover-body">

    <div class="app-title">EatMeFirst</div>
    
    <div class="cover-text">
        <div class="line1">seguimi e...</div>
        <div class="line2">non ti troverai più in questa situazione!</div>
    </div>

    <button class="cover-btn" onclick="window.location.href='configurazione.html'">Continua</button>

</body>
</html>
