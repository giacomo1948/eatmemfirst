<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatMeFirst - Copertina</title>
    <style>
        /* Regole per il reset di base */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Evita barre di scorrimento se l'immagine è grande */
        }

        /* Il contenitore principale che fa da sfondo a schermo intero */
        .fullscreen-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Qui impostiamo l'immagine */
            background-image: url('copertina.png');
            
            /* Proprietà fondamentali per l'effetto schermo intero */
            background-position: center center; /* Centra l'immagine */
            background-repeat: no-repeat; /* Non ripetere l'immagine */
            background-size: cover; /* Copre l'intera area, ritagliando se necessario per mantenere le proporzioni */
            
            /* Filtro opzionale per scurire l'immagine e far risaltare il testo */
            background-color: rgba(0, 0, 0, 0.5); /* Sovrapposizione semi-trasparente scura */
            background-blend-mode: darken; /* Fonde il colore con l'immagine */
        }

        /* Contenitore per il testo e il pulsante, centrati sopra l'immagine */
        .content-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centra perfettamente il blocco */
            text-align: center;
            color: white;
            z-index: 10; /* Assicura che il testo sia sopra l'immagine */
            width: 90%; /* Per adattamento su schermi piccoli */
            max-width: 600px; /* Limita la larghezza massima */
        }

        .app-title {
            font-size: 3rem; /* Titolo grande */
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Ombra per leggibilità */
        }

        .cover-text {
            margin-bottom: 40px;
            font-size: 1.2rem;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .cover-text .line1 {
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .cover-text .line2 {
            font-weight: bold;
        }

        .cover-btn {
            padding: 15px 40px;
            background-color: #27ae60; /* Verde del pulsante */
            color: white;
            border: none;
            border-radius: 30px; /* Pulsante arrotondato */
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.3s, transform 0.2s;
        }

        .cover-btn:hover {
            background-color: #219653;
            transform: translateY(-2px); /* Piccolo effetto al passaggio del mouse */
        }
    </style>
</head>
<body>

    <!-- Il div che contiene l'immagine di sfondo a tutto schermo -->
    <div class="fullscreen-bg"></div>

    <!-- Il blocco di testo e pulsante sovrapposto -->
    <div class="content-overlay">
        <div class="app-title">EatMeFirst</div>
        
        <div class="cover-text">
            <div class="line1">seguimi e...</div>
            <div class="line2">non ti troverai più in questa situazione!</div>
        </div>

        <button class="cover-btn" onclick="window.location.href='configurazione.html'">Continua</button>
    </div>

</body>
</html>
